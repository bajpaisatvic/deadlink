services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: deadlink-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: deadlink-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:15
    container_name: deadlink-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: deadlink
      POSTGRES_USER: deadlink
      POSTGRES_PASSWORD: deadlink
    volumes:
      - deadlink-pgdata:/var/lib/postgresql/data

  crawler-service:
    build: ./crawler-service
    container_name: deadlink-crawler
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deadlink
      SPRING_DATASOURCE_USERNAME: deadlink
      SPRING_DATASOURCE_PASSWORD: deadlink
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  checker-service:
      build: ./checker-service
      container_name: deadlink-checker
      ports:
        - "8082:8082"
      depends_on:
        - kafka
        - postgres
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deadlink
        SPRING_DATASOURCE_USERNAME: deadlink
        SPRING_DATASOURCE_PASSWORD: deadlink
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  alert-service:
      build: ./alert-service
      container_name: deadlink-alert
      ports:
        - "8083:8083"
      depends_on:
        - kafka
        - postgres
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deadlink
        SPRING_DATASOURCE_USERNAME: deadlink
        SPRING_DATASOURCE_PASSWORD: deadlink
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

volumes:
  deadlink-pgdata: